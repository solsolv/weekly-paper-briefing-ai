  # 최하단 표기: 왼쪽 개발자(이니셜 아바타·이름·문의 메일) / 오른쪽 마지막 업데이트·데이터 출처
  developer:
    name: "Eunseong Lee"
    initials: "EL"
    # 스팸 수집 방지: 주소를 아이디/도메인으로 나눠 두고 페이지 JS가 조립 (HTML·저장소에 완성 주소 없음)
    email_user: "eunseong.lee91"
    email_domain: "gmail.com"
  data_sources: "arXiv · Semantic Scholar · OpenAlex · Crossref · Hugging Face · Gemini 요약"

# -----------------------------------------------------------------------------
# 논문 선정
#   각 트랙은 [임팩트 1편 + 최신 1편] 두 슬롯으로 구성.
#   - 임팩트 슬롯: 12개월 lookback + (영향력 인용수×3 + 인용수) 상위 1편
#   - 최신 슬롯  : 14일  lookback + 발표일 최신 1편
#   - AI 트랙 최신 슬롯은 Hugging Face Papers trending에서 우선 가져옴(실패 시 arXiv fallback).
# -----------------------------------------------------------------------------
selection:
  exclude_already_featured: true
  min_abstract_chars: 200
  candidate_pool_per_track: 150   # 인용수 조회 대상 후보 수 상한 (트랙별)

  slots:
    impact:
      lookback_days: 365          # 임팩트 후보 lookback (12개월)
      score: "influential3plus"   # influential_cc * 3 + citation_cc
    latest:
      lookback_days: 14           # 최신 후보 lookback (2주)

  # 트랙별 최신 슬롯 데이터 소스
  latest_source:
    ai: "huggingface_weekly"      # AI 최신은 HF Papers trending에서
    mech: "arxiv"                 # 기계공학 최신은 arXiv 그대로

# -----------------------------------------------------------------------------
# Hugging Face Papers (AI 최신 슬롯 후보 풀)
# -----------------------------------------------------------------------------
huggingface:
  enabled: true
  top_n: 10                       # 최근 7일 daily papers를 upvote로 정렬 → 상위 N편을 후보 풀로
  fallback_to_arxiv: true         # HF 조회 실패/빈 결과 시 arXiv 최근 14일 최신순으로 자동 전환

# -----------------------------------------------------------------------------
# arXiv 수집 쿼리
#   - categories: arXiv 분류 코드 (https://arxiv.org/category_taxonomy)
#   - keywords  : 초록/제목에 포함돼야 하는 키워드 (mech 트랙에서 'AI 활용'을 거르기 위함)
# -----------------------------------------------------------------------------
arxiv:
  max_results_per_query: 400      # 임팩트 후보 풀 확보용 (이전 200 → 400)
  tracks:
    ai:
      categories: ["cs.AI", "cs.CL", "cs.CV", "cs.LG", "cs.NE", "cs.RO", "stat.ML"]
      keywords: []                # AI 트랙은 카테고리만으로 충분
    mech:
      # AI 활용 기계공학: 카테고리 ∩ (ML 키워드) ∩ (도메인 키워드)
      # - keywords (OR): ML/데이터 기반 방법론 — 1개 이상 매칭 필요
      # - keywords_domain (OR): 기계공학 응용 도메인 — 1개 이상 매칭 필요
      # 두 그룹 모두 통과해야 후보로 채택 (AND). 순수 수학·일반 ML 알고리즘 논문을 거름.
      # 유체(physics.flu-dyn) 카테고리는 현 시점 제외 — 추후 별도 유체 트랙으로 분리 예정.
      # cs.LG, math.NA는 ML/수학 이론 노이즈가 커서 제외 (PINN cross-list 누락 위험은 S2 보강이 흡수).
      categories: ["physics.comp-ph", "physics.class-ph", "cs.CE", "physics.app-ph", "physics.data-an"]
      keywords:
        - "machine learning"
        - "deep learning"
        - "neural network"
        - "physics-informed"
        - "neural operator"
        - "surrogate model"
        - "data-driven"
        - "reinforcement learning"
        - "generative model"
      keywords_domain:
        # 단일어 위주 — 후보 풀을 넉넉히 뽑고, 최종 선정은 LLM 적합도 게이트가 결정.
        # 유체(fluid/turbul/aerodynam/CFD) 키워드는 유체 트랙 분리 시까지 제외.
        # 구조해석·고체역학
        - "structural"
        - "finite element"
        - "vibrat"
        - "elastic"
        - "deform"
        - "stress"
        - "multiphysics"
        # 피로해석·파괴역학
        - "fatigue"
        - "fracture"
        - "crack"
        # 설계최적화·생성형 설계·위상최적화
        - "topology optimization"
        - "shape optimization"
        - "design optimization"
        - "generative design"
        # 예측진단(PHM)·디지털트윈
        - "PHM"
        - "prognostic"
        - "diagnostic"
        - "anomaly detection"
        - "condition monitoring"
        - "fault detection"
        - "predictive maintenance"
        - "remaining useful life"
        - "digital twin"
        # 로보틱스·기계 일반
        - "robot"
        - "manipulator"
        - "mechanical"
        - "aerospace"
        - "automotive"

# -----------------------------------------------------------------------------
# 관심 세부 주제 (요약·정렬 시 가산점 부여 / 표시용 태그)
# -----------------------------------------------------------------------------
interests:
  ai:
    - "LLM·생성형·에이전트"
    - "멀티모달·비전·생성모델"
    - "학습이론·최적화·경량화"
    - "강화학습·로보틱스"
  mech:
    - "시뮬레이션·구조해석"
    - "설계최적화·생성형 설계"
    - "진단·디지털트윈"

# 관심 주제 분류(사이트의 주제 필터)용 설명 — LLM이 주제 경계를 헷갈리지 않도록 범위를 구체화.
# 키는 위 interests 항목과 정확히 같아야 함. 없는 주제는 이름만으로 분류.
interests_hints:
  "LLM·생성형·에이전트": "대규모 언어 모델, LLM 에이전트·도구 사용, 텍스트 생성·추론, 프롬프트·정렬, LLM 학습·서빙 인프라"
  "멀티모달·비전·생성모델": "컴퓨터 비전, 시각-언어 모델(VLM), 이미지·비디오·3D 생성 및 재구성, 확산 모델"
  "학습이론·최적화·경량화": "학습 이론·일반화, 최적화 알고리즘, 모델 경량화·효율화(양자화·LoRA·추론 가속), 해석 가능성, 통계적 기법"
  "강화학습·로보틱스": "강화 학습 알고리즘, 로봇 조작·이동 정책, 시각-언어-행동(VLA) 모델, 체화 AI"
  "시뮬레이션·구조해석": "유한요소·수치해석 가속, 대리 모델·신경 연산자·PINN으로 물리 해석 대체, 재료 구성 모델(탄성·소성·점탄성), 구조·진동·파괴·충돌 해석"
  "설계최적화·생성형 설계": "위상 최적화, 형상·파라미터 설계 최적화, 생성형 설계, 설계 공간 탐색, 로봇·기계 시스템 설계·제어 최적화"
  "진단·디지털트윈": "고장 진단, 이상 탐지, 상태 감시, 잔존 수명 예측(PHM), 운영 중 시스템의 디지털 트윈, 계측 데이터 기반 파라미터 추정"

# -----------------------------------------------------------------------------
# LLM 적합도 게이트 — 슬롯별 상위 후보의 abstract를 LLM이 0~1 점수로 평가하고
# 임계값 이상만 통과시켜 사용자 선호 주제에 맞는 1편을 선정.
# 키워드는 후보 풀을 광범위하게 잡고, 최종 선별은 이 게이트가 담당.
# -----------------------------------------------------------------------------
relevance_gate:
  enabled: true
  apply_to_tracks: ["mech"]       # 우선 mech 트랙만. 결과 보고 ai로 확장.
  # 정렬된 후보 상위 N편을 LLM 평가 (한 호출 안에서 평가량만 증가, 호출 횟수는 동일).
  # 20→40: OpenAlex 저널 보강 후 인용 많은 저널 논문이 상위를 차지해도 arXiv·S2 후보가 채점 기회를 갖도록.
  # 채점 JSON ~40×40토큰 ≈ 1.6k → max_output_tokens(5000) 안.
  top_k: 40
  threshold: 0.7                  # 점수 ≥ 임계값만 통과 (엄격 게이트, 기존 0.5 → 0.7)
  # 게이트 호출 전용 출력 토큰 상한. top_k편 채점 JSON이 잘리지 않도록 요약용(1200)과 분리.
  # 실제 출력은 ~1000~2000토큰 수준. 무료 등급은 요청 수만 카운트하므로 비용/한도 영향 없고,
  # 상한일 뿐이라 평소 생성량·지연도 불변 → top_k 증가/reason 폭주 대비 넉넉히 5000.
  # (Gemini Flash 출력 한도 8192 미만이라 안전.)
  max_output_tokens: 5000
  # 카테고리 사전 필터는 미사용 — 수집 단계 categories 화이트리스트가 이미 분야를 좁힘.
  # LLM 게이트가 abstract 기반으로 최종 판단.
  required_categories: []
  # 게이트 모두 탈락 시 동작:
  #   "fallback_top1": 원본 상위 1편을 강제 채택 (빈 슬롯 방지)
  #   "skip":          슬롯을 비움
  empty_pool_behavior: "fallback_top1"
  description: |
    당신은 "AI 활용 기계공학" 논문 큐레이터입니다.
    abstract에서 다루는 **물리적 응용 도메인**이 사용자의 핵심 관심 영역(아래)에 부합하는지
    엄격히 판단합니다. 표면적 키워드(surrogate, neural operator 등)에 의존하지 마세요.

    [필수 조건 — 하나라도 미충족 시 0.2 이하로 평가]
    - abstract가 다루는 응용 대상이 구체적 물리 시스템임을 명시해야 함:
      고체/구조역학·진동·동역학, 열전달, 피로·파괴, 다물리, 회전기계·베어링 등.
    - 단순히 "surrogate model"·"neural operator"·"PINN" 용어가 등장해도,
      적용된 구체적 물리 시스템(어떤 구조/기계 부품)이 명시되지 않으면 ML 이론으로 간주.
    - ML 아키텍처·최적화 알고리즘·수학 이론 자체 연구(예: ICNN/SOCP/LP 일반화,
      함수 근사·수렴성·표현력 증명)는 응용 사례가 부수적으로 언급되어도 0.2 이하.

    [핵심 영역 — 점수 0.7~1.0]
    - 시뮬레이션·구조해석 (구체적 구조/기계 시스템에 PINN·neural operator·surrogate 적용)
    - 설계최적화·생성형 설계·위상최적화 (구체적 부품·구조 형상 대상)
    - 예측진단(PHM)·디지털트윈 (회전기·베어링·기계장치 fault diagnosis, prognostics, RUL)
      ※ 사용자 우선순위 반영: 핵심 영역으로 인정하되, 동일한 부합도일 때
        다른 핵심 영역 대비 약 0.05~0.10 낮게 평가 (예: 다른 핵심이 0.90이면 PHM은 0.80~0.85).
    - 피로해석 (fatigue life/damage prediction)
    - 파괴역학 (fracture, crack propagation simulation)
    - 산업용 로봇·매니퓰레이션 (응용 중심, 제어기 자체 학습은 제외)

    [인접 영역 — 점수 0.3~0.6]
    - 위 영역에 인접하나 핵심이 아닌 일반 ML 알고리즘 응용
    - 응용 도메인은 명시되어 있으나 사용자 핵심 관심에서 비껴난 경우

    [제외 분야 — 점수 0.0~0.2]
    - ML 아키텍처·최적화 알고리즘·수학 이론 자체 (응용은 부수적)
    - 유체역학·CFD·난류·공력 (별도 트랙으로 추후 분리 예정 — 현재 사이클에서는 제외)
    - 재료 합성·화학·적층제조·제조공정 자체
    - 제어(controller, MPC, model predictive control, feedback control, control system)
    - 상태 추정·관측기·시스템 식별(observer, state estimation, system identification, KKL)
    - 강화학습으로 제어기를 학습하는 경우의 제어 자체
    - 전력 시스템·계통 안정성 분석(power system, grid stability, data center power)
    - 순수 수학 최적화·알고리즘 이론·함수 근사 이론

# -----------------------------------------------------------------------------
# Semantic Scholar Search — 후보 풀 보강 소스 (arxiv에 없는 저널·컨퍼런스 mech 논문 흡수)
#   /paper/search/bulk 엔드포인트로 키워드 + 분야 필터링하여 추가 후보 수집.
#   arxiv 후보와 통합 후 DOI/arxiv_id/제목 기준으로 dedupe.
# -----------------------------------------------------------------------------
s2_search:
  enabled: true
  apply_to_tracks: ["mech"]       # mech만 보강 (AI는 arxiv+HF로 충분)
  # 쿼리: 공백 = AND, | = OR, +필수, -금지. abstract+title 매칭.
  # mech 트랙: ML 방법론 × 응용 도메인 광범위 매칭. fields_of_study가 분야 좁힘.
  query: "(machine learning | deep learning | neural network | physics-informed | neural operator | surrogate) (structural | vibration | fatigue | fracture | topology | digital twin | prognostic | bearing | robot | mechanical)"
  fields_of_study: ["Engineering", "Physics", "Computer Science", "Materials Science"]
  limit: 100                      # 한 번에 가져올 최대 편수
  min_year_offset_days: 365       # lookback 기준일. 호출 측 lookback과 동기화도 가능
  sort_impact: "citationCount:desc"
  sort_latest: "publicationDate:desc"

# -----------------------------------------------------------------------------
# 주간 검토 메일 (src/notify.py) — 토요일 빌드 끝에 Gmail SMTP로 본인에게 발송.
#   계정·앱 비밀번호·받는 주소는 GitHub Secret(GMAIL_USER / GMAIL_APP_PASSWORD / MAIL_TO)으로만 관리.
#   성공 → 인사말 + 주차 페이지 상단 캡처 + 사이트 링크 / 수동 재실행으로 완성 → 같은 본문, '보충 완료' 제목
#   필수 슬롯(ai·mech 4개) 실패·누락 → 미완료 알림(실패 슬롯 + 재실행 방법). 국내 0편은 정상.
# -----------------------------------------------------------------------------
notify:
  enabled: true
  from_name: "AI & AI 활용 기계공학 주간 논문 브리핑"
  briefing_name: "AI & AI 활용 기계공학 논문 브리핑"     # 본문 첫 줄: "<날짜(요일)> 주차 <이 이름>입니다."
  prefix_success: "[논문 브리핑]"
  prefix_refill: "[논문 브리핑 보충 완료]"
  prefix_incomplete: "[논문 브리핑 ⚠️ 미완료]"
  capture_width: 1000          # 넓은 폭 캡처 (제목 한 줄 표시)
  capture_max_height: 1400     # 넉넉히 찍은 뒤 아래 흰 여백 자동 자름(Pillow)
  repo_url: "https://github.com/solsolv/weekly-paper-briefing-ai"

# -----------------------------------------------------------------------------
# OpenAlex — 기계공학 저널 논문 후보 보강 (키 불필요, CC0 데이터)
#   arXiv·S2에 없는 저널 논문을 흡수. 결과는 트랙 키워드 필터 + LLM 게이트를 그대로 거친다.
#   주의: Elsevier·Springer 다수 저널은 OpenAlex에 초록이 없어(has_abstract) 자동 제외된다.
# -----------------------------------------------------------------------------
openalex:
  mailto_env: "OPENALEX_MAILTO"   # 선택: 환경변수에 연락 메일을 두면 polite pool(우선 처리) 사용
openalex_search:
  enabled: true
  apply_to_tracks: ["mech"]
  # 제목·초록 검색 (OpenAlex 불리언: AND / OR, 구문은 큰따옴표)
  query: '("machine learning" OR "deep learning" OR "neural network" OR "physics-informed" OR "neural operator" OR surrogate OR "digital twin")'
  # OpenAlex 세부 분야(subfield) — 항공·자동차·토목구조·전산역학·제어시스템·산업제조·기계·재료역학·해양
  subfield_ids: [2202, 2203, 2205, 2206, 2207, 2209, 2210, 2211, 2212]
  limit: 100
  sort_impact: "cited_by_count:desc"
  sort_latest: "publication_date:desc"

# -----------------------------------------------------------------------------
# 국내 논문 +1편 — 국내 학술지(ISSN 지정)를 OpenAlex로 수집(영문 초록) + Crossref 한글 원제목.
#   최신순 → AI 방법론 키워드(arxiv.tracks.mech.keywords) → 기계공학 게이트(전원 탈락 시 비움).
#   기존 4편과 별도 섹션으로 표시. 국내지는 월간·격월간이라 lookback을 넉넉히(90일).
# -----------------------------------------------------------------------------
domestic:
  enabled: true
  lookback_days: 90
  limit: 100
  # 국내 전용 게이트 임계값 — 기계공학 게이트(0.7)를 그대로 쓰면 제조·가공·결함검출 논문(0.4~0.55)이
  # 대부분 탈락해 후보가 부족 → 0.6으로 완화 (2026-10-26). 결과 보며 조정.
  gate_threshold: 0.6
  query: '("machine learning" OR "deep learning" OR "neural network" OR "artificial intelligence" OR "data-driven" OR "reinforcement learning" OR "physics-informed" OR surrogate OR CNN OR LSTM)'
  journals:
    - { issn: "1226-4873", name: "대한기계학회논문집 A" }
    - { issn: "1226-4881", name: "대한기계학회논문집 B" }
    - { issn: "1225-9071", name: "한국정밀공학회지" }
    - { issn: "1598-2785", name: "한국소음진동공학회논문집" }
    # --- 확장 후보 (2026-10-26 OpenAlex 실측: 최근 6개월 편수 / 초록 제공 / AI 관련 제목) ---
    # 주석을 풀면 바로 추가됨. 초록이 없는 논문은 요약 불가라 자동 제외되므로 초록 비율이 중요.
    # - { issn: "1229-3059", name: "한국전산구조공학회논문집" }      # 24편 / 초록 24/24 / AI 2  ← 구조해석, 추천
    # - { issn: "2508-5107", name: "한국생산제조학회지" }            # 38편 / 26/38 / AI 6       ← 제조·가공, 추천
    # - { issn: "1738-6225", name: "한국철도학회논문집" }            # 54편 / 43/50 / AI 3
    # - { issn: "1225-1348", name: "한국항공우주학회지" }            # 64편 / 38/50 / AI 2
    # - { issn: "1225-1143", name: "대한조선학회 논문집" }           # 28편 / 17/28 / AI 4
    # - { issn: "2287-9706", name: "한국유체기계학회 논문집" }       # 21편 / 20/21 / AI 1  (유체 — 현재 유체 제외 방침)
    # - { issn: "2508-4003", name: "한국CDE학회 논문집" }            # 18편 / 8/18 / AI 2   (초록 절반 미만)
    # 비추천(초록 거의 없음): 한국자동차공학회논문집 1225-6382 (2/50), 한국생산제조공학회지 1598-6721 (0/50)
    # Springer 발행 영문지는 OpenAlex·Crossref에 초록이 거의 없음 → Springer Nature API(무료 키) 필요:
    #   JMST 대한기계학회 1738-494X (0/50), IJPEM 한국정밀공학회 2234-7593 (9/50)
    # 그 밖의 국내 출처(조건부): KCI Open API(키·고정 IP·영리목적 불가·재배포 금지 — 2026-10 불채택),
    #   ScienceON(KISTI, 키 필요), RISS(키·이용조건 확인 필요). DBpia는 공개 API 없음.

# -----------------------------------------------------------------------------
# Semantic Scholar (인용수 + 저자 소속 기관 조회)
# -----------------------------------------------------------------------------
semantic_scholar:
  enabled: true
  api_key_env: "SEMANTIC_SCHOLAR_API_KEY"   # 선택. 없으면 비인증(낮은 rate limit)으로 동작
  request_delay_sec: 1.1                     # 비인증 시 rate limit 회피용 지연
  max_retries: 3

# -----------------------------------------------------------------------------
# 요약 LLM provider
#   provider: claude | openai_compat | ollama
# -----------------------------------------------------------------------------
llm:
  provider: "openai_compat"   # 무료 Gemini API (OpenAI 호환 엔드포인트) 사용
  summary_lines: 5            # 한 편당 목표 줄 수
  max_output_tokens: 1200
  temperature: 0.3
  tags_per_paper: 4           # 편당 추출할 한국어 키워드 수

  claude:
    model: "claude-sonnet-4-6"
    api_key_env: "ANTHROPIC_API_KEY"

  openai_compat:              # OpenAI 호환 엔드포인트 — Gemini / OpenAI / Together / Groq / vLLM 등
    # Google AI Studio 무료 등급. 키 발급: https://aistudio.google.com/
    # 무료 한도: gemini-2.5-flash = 분당 10 / 일 250 / 분당 25만 토큰 (주 4건 사용에 충분)
    model: "gemini-2.5-flash"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    api_key_env: "GEMINI_API_KEY"
    # Gemini 2.5는 reasoning 모델 — thinking 토큰이 응답을 잡아먹지 않도록 비활성화
    # 값: "none" | "low" | "medium" | "high" (Gemini OpenAI 호환 엔드포인트가 표준 지원)
    reasoning_effort: "none"

  ollama:                     # 로컬/사내 LLM. host는 사내망에서만 접근 가능 — GitHub Actions 클라우드 러너에서는 도달 불가
    model: "qwen3.5:9b-q8_0"            # 서버 'Qwen3_5-9B:Q8_server94'
    host: "http://10.32.168.94:11434"
    think: false                         # Qwen3 등 추론 모델의 thinking 모드 끄기 (요약 태스크 안정성)
