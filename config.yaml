# =============================================================================
# 주간 논문 브리핑 설정
# =============================================================================

site:
  title: "AI & AI 활용 기계공학 주간 논문 브리핑"   # <title>·데이터용. 화면 제목(2줄)은 templates/base.html hero
  description: "매주 월요일 아침, 꼭 읽어볼 만한 논문 4편을 한국어로 정리해 드립니다."
  # 링크 미리보기(OG)의 절대 주소 기준. 회사망에서도 열리는 Cloudflare Pages 주소를 대표 주소로 사용.
  # (GitHub Pages도 같은 docs/를 배포하므로 그대로 동작 — 미리보기 카드의 주소 표기만 이 주소로 나옴)
  base_url: "https://weekly-paper-briefing-ai.pages.dev"
